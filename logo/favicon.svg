<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0c1820"/>
      <stop offset="100%" stop-color="#04080c"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="32" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#5ee9e3" stroke-width="2.6" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#5ee9e3" stroke-width="0.8" opacity="0.5"/>
  <text x="32" y="40" font-family="Arial Black,Helvetica,sans-serif" font-size="20" font-weight="900" fill="#5ee9e3" text-anchor="middle" filter="url(#glow)">14</text>
</svg>
